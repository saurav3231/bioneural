[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioneural"
version = "0.1.0"
description = "A living, event-driven, quantized, backprop-free neural organism. Intelligence per joule, not intelligence per parameter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BioNeural Team" }]
keywords = [
    "neuromorphic", "spiking-neural-network", "ternary-quantization",
    "hebbian-learning", "predictive-coding", "event-driven", "memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "datasets>=2.14",
    "tokenizers>=0.15",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "triton>=2.2",
    "nvidia-ml-py>=12.535",
    "psutil>=5.9",
]
gpu = ["triton>=2.2", "nvidia-ml-py>=12.535", "psutil>=5.9"]

[project.scripts]
bioneural-train = "scripts.train:main"
bioneural-bench = "scripts.bench:main"
bioneural-smoke = "scripts.smoke:main"

[tool.setuptools.packages.find]
include = ["bioneural*"]

[tool.setuptools.package-data]
bioneural = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.isort]
known-first-party = ["bioneural"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
